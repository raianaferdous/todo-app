<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Task</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="container">

        <h1>Edit Task</h1>


        <form
            action="/edit/{{ task.id }}"
            method="POST"
            class="edit-form"
        >


            <!-- Task -->

            <label for="task">
                Task
            </label>

            <input
                type="text"
                id="task"
                name="task"
                value="{{ task.title }}"
                required
            >


            <!-- Due Date -->

            <label for="due_date">
                Due Date
            </label>

            <input
                type="date"
                id="due_date"
                name="due_date"
                value="{% if task.due_date %}{{ task.due_date.strftime('%Y-%m-%d') }}{% endif %}"
            >


            <!-- Priority -->

            <label for="priority">
                Priority
            </label>

            <select
                id="priority"
                name="priority"
            >

                <option
                    value="Low"
                    {% if task.priority == "Low" %}selected{% endif %}
                >
                    Low Priority
                </option>

                <option
                    value="Medium"
                    {% if task.priority == "Medium" %}selected{% endif %}
                >
                    Medium Priority
                </option>

                <option
                    value="High"
                    {% if task.priority == "High" %}selected{% endif %}
                >
                    High Priority
                </option>

            </select>


            <!-- Category -->

            <label for="category">
                Category
            </label>

            <select
                id="category"
                name="category"
            >

                <option
                    value="Study"
                    {% if task.category == "Study" %}selected{% endif %}
                >
                    📚 Study
                </option>

                <option
                    value="Work"
                    {% if task.category == "Work" %}selected{% endif %}
                >
                    💼 Work
                </option>

                <option
                    value="Personal"
                    {% if task.category == "Personal" %}selected{% endif %}
                >
                    🏠 Personal
                </option>

                <option
                    value="Shopping"
                    {% if task.category == "Shopping" %}selected{% endif %}
                >
                    🛒 Shopping
                </option>

            </select>


            <button
                type="submit"
                class="add-button"
            >
                Save Changes
            </button>

        </form>


        <br>


        <a href="/">
            Back to To-Do List
        </a>

    </div>

</body>

</html>
